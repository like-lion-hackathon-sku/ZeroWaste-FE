[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"


[[redirects]]
  from = "/_be/*"
  to = "https://zerowaste-be-skthon.onrender.com/api/:splat"
  status = 200
  force = true
  # (선택) 백엔드가 Host체크하면 도움됨
  headers = { X-Forwarded-Host = ":host" }
