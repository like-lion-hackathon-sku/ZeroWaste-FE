# netlify.toml (최종 권장)
[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# ✅ 오직 /_be/* 만 백엔드로 프록시
[[redirects]]
  from = "/_be/*"
  to = "https://zerowaste-be-9c49.onrender.com/api/:splat"
  status = 200
  force = true
  headers = { X-Forwarded-Host = ":host" }
