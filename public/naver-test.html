<!-- /public/naver-test.html -->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Navermap Test</title>
    <style> #map{width:100vw;height:100vh;} </style>
    <script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpClientId=여기에_현재_ID" defer></script>
    <script>
      window.addEventListener('load', () => {
        if (!window.naver) { alert('naver 객체 없음'); return; }
        const c = new naver.maps.LatLng(37.35957, 127.105399);
        new naver.maps.Map('map', { center:c, zoom:12 });
      });
    </script>
  </head>
  <body><div id="map"></div></body>
</html>
